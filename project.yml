name: Mihrap
options:
  bundleIdPrefix: com.mihrap
  deploymentTarget:
    iOS: "15.0"
targets:
  Mihrap:
    type: application
    platform: iOS
    sources:
      - path: Mihrap
        excludes:
          - "Resources/**"
      - path: Mihrap/Resources/strings
        type: folder
        buildPhase: resources
      - path: Mihrap/Resources/fonts
        type: folder
        buildPhase: resources
      - path: Mihrap/Resources/home
        type: folder
        buildPhase: resources
      - path: Mihrap/Resources/texts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Mihrap
        PRODUCT_BUNDLE_IDENTIFIER: com.mihrap.iphone
        INFOPLIST_FILE: Mihrap/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.4.1"
        CURRENT_PROJECT_VERSION: "6"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
