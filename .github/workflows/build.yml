name: Build unsigned IPA (native app)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned; Sideloadly signs it)
        run: |
          set -o pipefail
          if ! xcodebuild -project Mihrap.xcodeproj -target Mihrap -configuration Release -sdk iphoneos \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              SYMROOT="$PWD/build" build > build.log 2>&1; then
            grep -E "error:|BUILD FAILED" build.log | sort -u
            exit 1
          fi
          grep -E "warning:" build.log | grep "/Mihrap/" | sort -u || true
          test -f build/Release-iphoneos/Mihrap.app/Mihrap
          test -f build/Release-iphoneos/Mihrap.app/Info.plist

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/Mihrap.app Payload/
          zip -qry Mihrap.ipa Payload
          ls -l Mihrap.ipa
          shasum -a 256 Mihrap.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Mihrap-ipa
          path: Mihrap.ipa
          retention-days: 30
